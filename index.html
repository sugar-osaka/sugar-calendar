<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sugar 営業カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Yomogi&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fafaf8;min-height:100vh;padding:0 0 40px}
.wrap{max-width:480px;margin:0 auto;padding:1.5rem 1rem;font-family:'Yomogi',cursive}
.header{text-align:center;margin-bottom:1rem}
.header img{width:160px;height:auto;display:block;margin:0 auto 6px}
.header p{font-size:11px;letter-spacing:0.2em;color:#bbb;margin-top:4px;font-family:'Caveat Brush',cursive}
.tabs{display:flex;gap:0;justify-content:center;margin-bottom:1rem;border:1.5px solid #f0c0c0;border-radius:20px;overflow:hidden;width:fit-content;margin-left:auto;margin-right:auto}
.tab{padding:8px 22px;font-size:15px;cursor:pointer;background:#fff;color:#ccc;border:none;transition:all 0.15s;font-family:'Caveat Brush',cursive}
.tab:first-child{border-right:1.5px solid #f0c0c0}
.tab.active{background:#e8383d;color:#fff}
.shop-info-top{padding:4px 0;margin-bottom:1rem;font-size:11px;color:#888;font-family:'Yomogi',cursive;line-height:2}
.shop-info-top .info-row{display:flex;align-items:center;gap:6px}
.shop-info-top .info-icon{width:18px;height:18px;flex-shrink:0}
.shop-info-top .info-icon svg{width:18px;height:18px}
.shop-info-top b{font-weight:400}
.nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:0.8rem}
.nav button{background:none;border:1.5px solid #f0c0c0;border-radius:50%;width:30px;height:30px;cursor:pointer;color:#e8383d;display:flex;align-items:center;justify-content:center;font-size:18px}
.month{font-size:26px;color:#e8383d;min-width:140px;text-align:center;font-family:'Caveat Brush',cursive}
.cal-wrap{position:relative}
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:14px;color:#ccc;padding:6px 0 8px;text-align:center;font-weight:400;font-family:'Caveat Brush',cursive}
.cal th.sun{color:#e8383d}
.cal th.sat{color:#e8383d;opacity:0.5}
.cal th:not(:first-child),.cal td:not(:first-child){border-left:1.5px dotted rgba(111,84,54,0.5)}
.cal td{vertical-align:top;padding:4px;border-top:none;height:96px;width:14.28%}
.cal td.other .date-num{color:#eee}
.cal td.today .date-num{background:#e8383d;color:#fff!important;border-radius:50%}
.cal td.sun .date-num{color:#e8383d}
.cal td.sat .date-num{color:#e8383d;opacity:0.5}
.cal td.other.sun .date-num,.cal td.other.sat .date-num{color:#eee}
.date-num{font-size:20px;margin-bottom:3px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:'Caveat Brush',cursive}
.dot-row{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.dot svg{width:20px;height:20px;flex-shrink:0}
.dot-cake{background:#FDE8E8;color:#c02025}
.dot-crepe{background:#FFF3E0;color:#b85c00}
.dot-muffin{background:#FFF8E1;color:#8a6000}
.dot-takeout{background:#fdede4;color:#e95464}
.dot-cafe{background:#E3F2FD;color:#1565c0}
.dot-cafe2{background:#E8F5E9;color:#2e7d32}
.pill-closed{background:#e8383d;color:#fff;padding:3px 7px;border-radius:10px;font-size:11px;display:inline-block;margin-bottom:2px;font-family:'Yomogi',cursive}
.pill-event{background:#00533f;color:#fff;padding:3px 7px;border-radius:10px;font-size:11px;display:inline-block;margin-bottom:2px;font-family:'Yomogi',cursive}
.legend-wrap{margin-top:1.2rem;padding-top:1rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#aaa;font-family:'Yomogi',cursive}
.leg-dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.leg-dot svg{width:20px;height:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img src="logo.png" alt="sugar logo">
    <p>営業カレンダー</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setShop('sagisu')">sagisu</button>
    <button class="tab" onclick="setShop('ebie')">ebie</button>
  </div>
  <div class="shop-info-top" id="shop-info-top"></div>
  <div class="nav">
    <button onclick="changeMonth(-1)">&#8249;</button>
    <div class="month" id="month-label"></div>
    <button onclick="changeMonth(1)">&#8250;</button>
  </div>
  <div class="cal-wrap">
    <svg id="row-lines" style="position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:2;overflow:visible" xmlns="http://www.w3.org/2000/svg"></svg>
    <table class="cal" id="cal"></table>
  </div>
  <div class="legend-wrap"><div class="legend" id="legend"></div></div>
</div>
<script>
var shop = 'sagisu';
var now = new Date();
var year = now.getFullYear();
var month = now.getMonth();
var today = now;
var maxYear = now.getMonth() === 11 ? now.getFullYear() + 1 : now.getFullYear();
var maxMonth = now.getMonth() === 11 ? 0 : now.getMonth() + 1;

var COLORS = {
  cake: '#c02025', crepe: '#b85c00', muffin: '#8a6000',
  takeout: '#e95464', cafe: '#1565c0', cafe2: '#2e7d32'
};

var SVG = {
  cake: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="9" x2="8" y2="5"/><line x1="12" y1="9" x2="12" y2="4"/><line x1="16" y1="9" x2="16" y2="5"/><path d="M7 4.5 Q8 3 9 4.5"/><path d="M11 3 Q12 1.5 13 3"/><path d="M15 4.5 Q16 3 17 4.5"/><rect x="3" y="9" width="18" height="11" rx="2.5"/><path d="M3 13 Q7 11 12 13 Q17 11 21 13"/><line x1="3" y1="16" x2="21" y2="16"/></svg>',
  crepe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10 L12 22 L19 10 Z"/><path d="M5 10 Q12 7 19 10"/><path d="M7 10 Q9 8 12 8 Q15 8 17 10"/><path d="M8 7 Q8 4 10 4 Q12 3 14 4 Q16 4 16 7"/><path d="M9 6 Q10 4.5 12 4.5 Q14 4.5 15 6"/><circle cx="10" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="13" cy="4.5" r="0.8" fill="currentColor" stroke="none"/></svg>',
  muffin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13 L8 21 L16 21 L17 13 Z"/><line x1="10" y1="13" x2="9.5" y2="21"/><line x1="12" y1="13" x2="12" y2="21"/><line x1="14" y1="13" x2="14.5" y2="21"/><path d="M7 13 Q5 13 5 10 Q5 7 8 6 Q9 3 12 3 Q15 3 16 6 Q19 7 19 10 Q19 13 17 13 Q15 14 12 14 Q9 14 7 13 Z"/><path d="M8 7 Q9 5.5 11 6"/><path d="M14 5.5 Q15.5 6.5 15 8"/></svg>',
  takeout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="15" width="18" height="4" rx="1"/><rect x="3" y="11" width="18" height="4" rx="0.5"/><path d="M3 11 L12 5 L21 11"/><path d="M3 11 Q7 9.5 12 10.5 Q17 9.5 21 11"/><ellipse cx="12" cy="5.5" rx="3" ry="3.5" fill="currentColor" stroke="none"/><path d="M10.5 3 Q12 1.8 13.5 3" stroke="currentColor" stroke-width="1" fill="none"/></svg>',
  cafe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L17 8 L15 19 L9 19 Z"/><path d="M17 10 Q21 10 21 14 Q21 18 17 18"/><line x1="5" y1="22" x2="19" y2="22"/><path d="M10 5 Q10 3 12 3 Q12 5 10 5"/></svg>',
  cafe2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L17 8 L15 19 L9 19 Z"/><path d="M17 10 Q21 10 21 14 Q21 18 17 18"/><line x1="5" y1="22" x2="19" y2="22"/><path d="M9 5 Q11 2 13 5"/></svg>'
};

// ===== 特別予定をここに入力 =====
// 例: specialEvents['2026-5-10'] = [{type:'closed', label:'臨時休業'}];
// 例: specialEvents['2026-6-15'] = [{type:'event', label:'イベント 11:00〜20:00'}];
var specialEvents = {};

// ===== マフィンのON/OFF (ebieのみ) =====
// 例: muffinOverride['2026-5-10'] = false;
// 例: muffinOverride['2026-5-12'] = true;
var muffinOverride = {};

function key(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }

var DOTCLS = {
  cake:'dot-cake', crepe:'dot-crepe', muffin:'dot-muffin',
  takeout:'dot-takeout', cafe:'dot-cafe', cafe2:'dot-cafe2'
};

var shops = {
  sagisu: {
    getInfoRows: function() {
      return [
        {type:'cake', text:'ホールケーキ　<b>金-火</b> 12:00–17:00'},
        {type:'crepe', text:'クレープ　<b>火-土</b> 12:00–16:00'}
      ];
    },
    getLegend: function() {
      return [
        {cls:'dot-cake', svg:SVG.cake, label:'ホールケーキ'},
        {cls:'dot-crepe', svg:SVG.crepe, label:'クレープ'},
        {pill:'#e8383d', label:'臨時休業'},
        {pill:'#00533f', label:'イベント'}
      ];
    },
    getEvents: function(d) {
      var sp = specialEvents[key(d)]; if (sp) return sp;
      var w = d.getDay(), evs = [];
      if (w !== 3 && w !== 4) evs.push({type:'cake'});
      if (w !== 0 && w !== 1) evs.push({type:'crepe'});
      return evs;
    }
  },
  ebie: {
    getInfoRows: function() {
      return [
        {type:'takeout', text:'テイクアウト　<b>金-火</b> 12:00–18:00'},
        {type:'cafe', text:'イートイン　<b>金-火</b> 13:00–18:00(L.O.17:30)'},
        {type:'cafe2', text:'気まぐれカフェ(テイクアウト)<b>水・木</b> 12:00–16:30'},
        {type:'muffin', text:'マフィン　<b>月・火・金</b> 12:00-18:00'}
      ];
    },
    getLegend: function() {
      return [
        {cls:'dot-takeout', svg:SVG.takeout, label:'テイクアウト'},
        {cls:'dot-cafe', svg:SVG.cafe, label:'イートイン'},
        {cls:'dot-cafe2', svg:SVG.cafe2, label:'気まぐれカフェ / 気まぐれテイクアウト'},
        {cls:'dot-muffin', svg:SVG.muffin, label:'マフィン'},
        {pill:'#e8383d', label:'臨時休業'},
        {pill:'#00533f', label:'イベント'}
      ];
    },
    getEvents: function(d) {
      var sp = specialEvents[key(d)]; if (sp) return sp;
      var w = d.getDay(), evs = [];
      if (w === 3 || w === 4) {
        evs.push({type:'cafe2'});
      } else {
        evs.push({type:'takeout'});
        evs.push({type:'cafe'});
      }
      var mo = muffinOverride[key(d)];
      if (mo === true || (mo === undefined && (w === 1 || w === 2 || w === 5))) evs.push({type:'muffin'});
      return evs;
    }
  }
};

function setShop(s) {
  shop = s;
  var tabs = document.querySelectorAll('.tab');
  tabs[0].classList.toggle('active', s === 'sagisu');
  tabs[1].classList.toggle('active', s === 'ebie');
  render();
}

function changeMonth(d) {
  var nm = month + d;
  var ny = nm > 11 ? year + 1 : nm < 0 ? year - 1 : year;
  var nmo = nm > 11 ? 0 : nm < 0 ? 11 : nm;
  if (ny > maxYear || (ny === maxYear && nmo > maxMonth)) return;
  if (ny < now.getFullYear() || (ny === now.getFullYear() && nmo < now.getMonth())) return;
  year = ny; month = nmo; render();
}

function drawRowLines() {
  var cal = document.getElementById('cal');
  var svg = document.getElementById('row-lines');
  var wrap = document.querySelector('.cal-wrap');
  var wrapRect = wrap.getBoundingClientRect();
  var calRect = cal.getBoundingClientRect();
  var rows = cal.querySelectorAll('tbody tr');
  var paths = '';
  rows.forEach(function(row) {
    var r = row.getBoundingClientRect();
    var y = r.top - wrapRect.top;
    var x0 = calRect.left - wrapRect.left;
    var W = calRect.width;
    var segs = 16, step = W / segs;
    var d = 'M ' + x0 + ' ' + y;
    for (var s = 0; s < segs; s++) {
      var cx = x0 + s * step + step * 0.4;
      var cy = y + (s % 2 === 0 ? -1.5 : 1.5);
      var ex = x0 + (s + 1) * step;
      d += ' Q ' + cx + ' ' + cy + ' ' + ex + ' ' + y;
    }
    paths += '<path d="' + d + '" stroke="#6f5436" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>';
  });
  svg.innerHTML = paths;
}

function render() {
  var labs = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('month-label').textContent = labs[month] + ' ' + year;

  var infoHTML = '';
  shops[shop].getInfoRows().forEach(function(r) {
    var c = COLORS[r.type];
    var sv = SVG[r.type].replace('stroke="currentColor"', 'stroke="' + c + '"');
    infoHTML += '<div class="info-row"><div class="info-icon" style="color:' + c + '">' + sv + '</div><span style="color:' + c + '">' + r.text + '</span></div>';
  });
  document.getElementById('shop-info-top').innerHTML = infoHTML;

  var legendHTML = '';
  shops[shop].getLegend().forEach(function(l) {
    if (l.pill) {
      legendHTML += '<div class="leg"><div class="leg-dot" style="background:' + l.pill + ';color:#fff;font-size:10px;border-radius:10px;padding:0 6px;width:auto;min-width:28px">' + l.label + '</div></div>';
    } else {
      legendHTML += '<div class="leg"><div class="leg-dot ' + l.cls + '">' + l.svg + '</div><span>' + l.label + '</span></div>';
    }
  });
  document.getElementById('legend').innerHTML = legendHTML;

  var first = new Date(year, month, 1);
  var last = new Date(year, month + 1, 0);
  var startDay = first.getDay();
  var html = '<tr><th class="sun">Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th class="sat">Sat</th></tr>';
  var day = 1 - startDay;
  for (var row = 0; row < 6; row++) {
    html += '<tr>';
    for (var col = 0; col < 7; col++) {
      var d = new Date(year, month, day);
      var isOther = day < 1 || day > last.getDate();
      var isToday = d.toDateString() === today.toDateString();
      var cls = '';
      if (isOther) cls += ' other';
      if (isToday) cls += ' today';
      if (col === 0) cls += ' sun';
      if (col === 6) cls += ' sat';
      html += '<td class="' + cls.trim() + '">';
      if (!isOther) {
        html += '<div class="date-num">' + day + '</div>';
        var evs = shops[shop].getEvents(d);
        var hasSpecial = evs.some(function(e) { return e.type === 'closed' || e.type === 'event'; });
        if (hasSpecial) {
          evs.forEach(function(e) {
            if (e.type === 'closed') html += '<div class="pill-closed">' + (e.label || '臨時休業') + '</div>';
            if (e.type === 'event') html += '<div class="pill-event">' + (e.label || 'イベント') + '</div>';
          });
        } else {
          html += '<div class="dot-row">';
          evs.forEach(function(e) {
            html += '<div class="dot ' + (DOTCLS[e.type] || '') + '">' + (SVG[e.type] || '') + '</div>';
          });
          html += '</div>';
        }
      }
      html += '</td>';
      day++;
    }
    html += '</tr>';
    if (day > last.getDate() && row >= 4) break;
  }
  document.getElementById('cal').innerHTML = html;
  setTimeout(drawRowLines, 100);
}

document.fonts.ready.then(function() { render(); });
render();
window.addEventListener('resize', function() { setTimeout(drawRowLines, 100); });
</script>
</body>
</html>
