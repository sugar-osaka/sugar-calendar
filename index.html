<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sugar 営業カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Yomogi&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fafaf8;min-height:100vh;padding:0 0 40px}
.wrap{max-width:480px;margin:0 auto;padding:1.5rem 1rem;font-family:'Yomogi',cursive}
.header{text-align:center;margin-bottom:1.5rem}
.header h1{font-size:34px;font-weight:400;color:#4A7EC7;letter-spacing:0.15em;font-family:'Caveat Brush',cursive}
.header p{font-size:12px;letter-spacing:0.2em;color:#aaa;margin-bottom:4px;font-family:'Caveat Brush',cursive}
.tabs{display:flex;gap:0;justify-content:center;margin-bottom:1.5rem;border:1px solid #ddd;border-radius:20px;overflow:hidden;width:fit-content;margin-left:auto;margin-right:auto}
.tab{padding:8px 22px;font-size:15px;cursor:pointer;background:#fff;color:#999;border:none;transition:all 0.15s;font-family:'Caveat Brush',cursive}
.tab:first-child{border-right:1px solid #ddd}
.tab.active{background:#4A7EC7;color:#fff}
.nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:1rem}
.nav button{background:none;border:1px solid #ddd;border-radius:50%;width:30px;height:30px;cursor:pointer;color:#999;display:flex;align-items:center;justify-content:center;font-size:18px;font-family:'Caveat Brush',cursive}
.month{font-size:26px;color:#4A7EC7;min-width:140px;text-align:center;font-family:'Caveat Brush',cursive}
.cal{width:100%;border-collapse:collapse}
.cal th{font-size:14px;color:#aaa;padding:6px 0 8px;text-align:center;font-weight:400;font-family:'Caveat Brush',cursive}
.cal th.sun{color:#E05C8A}
.cal th.sat{color:#4A7EC7}
.cal td{vertical-align:top;padding:4px;border-top:1px dashed #eee;height:88px;width:14.28%}
.cal td.other .date-num{color:#ddd}
.cal td.today .date-num{background:#4A7EC7;color:#fff!important;border-radius:50%}
.cal td.sun .date-num{color:#E05C8A}
.cal td.sat .date-num{color:#4A7EC7}
.cal td.other.sun .date-num,.cal td.other.sat .date-num{color:#ddd}
.date-num{font-size:20px;margin-bottom:3px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:'Caveat Brush',cursive}
.dot-row{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent}
.dot svg{width:15px;height:15px;flex-shrink:0}
.dot-cake{background:#FFF0F5;color:#C45C8A;border-color:#F0B8D0}
.dot-crepe{background:#F0FAF0;color:#3B8A3B;border-color:#A8D8A8}
.dot-muffin{background:#FFF8ED;color:#C47820;border-color:#F0C880}
.dot-takeout{background:#EDFAF5;color:#1A8060;border-color:#80D0B0}
.dot-cafe{background:#EDF5FF;color:#2060C0;border-color:#90B8F0}
.dot-cafe2{background:#F5EEFF;color:#6040B0;border-color:#C0A0E8}
.pill-closed{background:#E05C8A;color:#fff;padding:3px 7px;border-radius:10px;font-size:11px;display:inline-block;margin-bottom:2px;font-family:'Yomogi',cursive}
.pill-event{background:#4A7EC7;color:#fff;padding:3px 7px;border-radius:10px;font-size:11px;display:inline-block;margin-bottom:2px;font-family:'Yomogi',cursive}
.legend-wrap{margin-top:1.2rem;padding-top:1rem;border-top:1px dashed #eee}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#888;font-family:'Yomogi',cursive}
.leg-dot{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid transparent}
.leg-dot svg{width:15px;height:15px}
.info{margin-top:1rem;padding-top:0.8rem;border-top:1px dashed #eee;font-size:12px;color:#888;line-height:2;text-align:center;font-family:'Yomogi',cursive}
.info b{color:#4A7EC7;font-weight:400}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <p>営業カレンダー</p>
    <h1>sugar</h1>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setShop('sagisu')">sagisu</button>
    <button class="tab" onclick="setShop('ebie')">ebie</button>
  </div>
  <div class="nav">
    <button onclick="changeMonth(-1)">&#8249;</button>
    <div class="month" id="month-label"></div>
    <button onclick="changeMonth(1)">&#8250;</button>
  </div>
  <table class="cal" id="cal"></table>
  <div class="legend-wrap"><div class="legend" id="legend"></div></div>
  <div class="info" id="shop-info"></div>
</div>

<script>
let shop='sagisu';
const now=new Date();
let year=now.getFullYear(),month=now.getMonth();
const today=now;
const maxYear=now.getMonth()===11?now.getFullYear()+1:now.getFullYear();
const maxMonth=now.getMonth()===11?0:now.getMonth()+1;

const SVG={
  cake:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c0 0 0 3 0 4"/><path d="M5 10h14l-1 10H6L5 10z"/><path d="M5 10c0-2 2-3 7-3s7 1 7 3"/><path d="M5 15h14"/></svg>`,
  crepe:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L20 20 L4 20 Z"/><path d="M8 14 Q12 11 16 14"/></svg>`,
  muffin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 Q8 2 12 2 Q16 2 16 5"/><path d="M5 11 Q5 6 12 6 Q19 6 19 11"/><path d="M6 11 Q5 13 7 14 L8 21 L16 21 L17 14 Q19 13 18 11"/><path d="M6 11 L18 11"/></svg>`,
  takeout:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="1"/><path d="M4 14 Q12 10 20 14"/><path d="M8 11 Q8 6 12 6 Q16 6 16 11"/><path d="M11 4 Q12 2 13 4"/></svg>`,
  cafe:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L17 8 L15 19 L9 19 Z"/><path d="M17 10 Q21 10 21 14 Q21 18 17 18"/><line x1="5" y1="22" x2="19" y2="22"/></svg>`,
  cafe2:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L17 8 L15 19 L9 19 Z"/><path d="M17 10 Q21 10 21 14 Q21 18 17 18"/><line x1="5" y1="22" x2="19" y2="22"/><path d="M10 5 Q12 2 14 5"/></svg>`,
};

// ===== 特別予定をここに入力 =====
// 例: specialEvents['2026-5-10'] = [{type:'closed', label:'臨時休業'}];
// 例: specialEvents['2026-5-20'] = [{type:'event', label:'イベント 11:00〜20:00'}];
const specialEvents={};

// ===== マフィンのON/OFF (ebieのみ) =====
// 例: muffinOverride['2026-5-10'] = false; // その日だけなし
// 例: muffinOverride['2026-5-12'] = true;  // その日だけあり
const muffinOverride={};

function key(d){return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;}

const shops={
  sagisu:{
    getLegend(){return[
      {cls:'dot-cake',bcls:'#FFF0F5',bcol:'#F0B8D0',svg:SVG.cake,label:'ホールケーキ'},
      {cls:'dot-crepe',bcls:'#F0FAF0',bcol:'#A8D8A8',svg:SVG.crepe,label:'クレープ'},
      {pill:'#E05C8A',label:'臨時休業'},
      {pill:'#4A7EC7',label:'イベント'},
    ];},
    info:'<b>金〜火</b> ホールケーキ 12:00–17:00 &nbsp;|&nbsp; <b>火〜土</b> クレープ 12:00–16:00',
    getEvents(d){
      const sp=specialEvents[key(d)];if(sp)return sp;
      const w=d.getDay(),evs=[];
      if(w!==3&&w!==4)evs.push({type:'cake'});
      if(w!==0&&w!==1)evs.push({type:'crepe'});
      return evs;
    }
  },
  ebie:{
    getLegend(){return[
      {cls:'dot-takeout',bcls:'#EDFAF5',bcol:'#80D0B0',svg:SVG.takeout,label:'テイクアウト'},
      {cls:'dot-cafe',bcls:'#EDF5FF',bcol:'#90B8F0',svg:SVG.cafe,label:'イートイン'},
      {cls:'dot-cafe2',bcls:'#F5EEFF',bcol:'#C0A0E8',svg:SVG.cafe2,label:'気まぐれ'},
      {cls:'dot-muffin',bcls:'#FFF8ED',bcol:'#F0C880',svg:SVG.muffin,label:'マフィン'},
      {pill:'#E05C8A',label:'臨時休業'},
      {pill:'#4A7EC7',label:'イベント'},
    ];},
    info:'<b>金〜火</b> テイクアウト 12–18時・イートイン 13–17:30 &nbsp;|&nbsp; <b>水・木</b> 気まぐれ 12–16:30<br><b>月・火・金</b> マフィン販売（変動あり）',
    getEvents(d){
      const sp=specialEvents[key(d)];if(sp)return sp;
      const w=d.getDay(),evs=[];
      if(w===3||w===4){evs.push({type:'cafe2'});}
      else{evs.push({type:'takeout'});evs.push({type:'cafe'});}
      const mo=muffinOverride[key(d)];
      if(mo===true||(mo===undefined&&(w===1||w===2||w===5)))evs.push({type:'muffin'});
      return evs;
    }
  }
};

const DOTCLS={cake:'dot-cake',crepe:'dot-crepe',muffin:'dot-muffin',takeout:'dot-takeout',cafe:'dot-cafe',cafe2:'dot-cafe2'};

function setShop(s){
  shop=s;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&s==='sagisu')||(i===1&&s==='ebie')));
  render();
}

function changeMonth(d){
  const nm=month+d,ny=nm>11?year+1:nm<0?year-1:year,nmo=nm>11?0:nm<0?11:nm;
  if(ny>maxYear||(ny===maxYear&&nmo>maxMonth))return;
  if(ny<now.getFullYear()||(ny===now.getFullYear()&&nmo<now.getMonth()))return;
  year=ny;month=nmo;render();
}

function render(){
  const labs=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('month-label').textContent=`${labs[month]} ${year}`;
  document.getElementById('shop-info').innerHTML=shops[shop].info;
  document.getElementById('legend').innerHTML=shops[shop].getLegend().map(l=>
    l.pill
      ?`<div class="leg"><div class="leg-dot" style="background:${l.pill};color:#fff;font-size:10px;border-radius:10px;border:none;padding:0 6px;width:auto;min-width:24px">${l.label}</div></div>`
      :`<div class="leg"><div class="leg-dot ${l.cls}" style="background:${l.bcls};border-color:${l.bcol}">${l.svg}</div><span>${l.label}</span></div>`
  ).join('');

  const first=new Date(year,month,1),last=new Date(year,month+1,0),startDay=first.getDay();
  let html='<tr><th class="sun">Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th class="sat">Sat</th></tr>';
  let day=1-startDay;
  for(let row=0;row<6;row++){
    html+='<tr>';
    for(let col=0;col<7;col++){
      const d=new Date(year,month,day);
      const isOther=day<1||day>last.getDate();
      const isToday=d.toDateString()===today.toDateString();
      let cls='';
      if(isOther)cls+=' other';if(isToday)cls+=' today';
      if(col===0)cls+=' sun';if(col===6)cls+=' sat';
      html+=`<td class="${cls.trim()}">`;
      if(!isOther){
        html+=`<div class="date-num">${day}</div>`;
        const evs=shops[shop].getEvents(d);
        const hasSpecial=evs.some(e=>e.type==='closed'||e.type==='event');
        if(hasSpecial){
          evs.forEach(e=>{
            if(e.type==='closed')html+=`<div class="pill-closed">${e.label||'臨時休業'}</div>`;
            if(e.type==='event')html+=`<div class="pill-event">${e.label||'イベント'}</div>`;
          });
        }else{
          html+='<div class="dot-row">';
          evs.forEach(e=>{html+=`<div class="dot ${DOTCLS[e.type]||''}">${SVG[e.type]||''}</div>`;});
          html+='</div>';
        }
      }
      html+='</td>';day++;
    }
    html+='</tr>';
    if(day>last.getDate()&&row>=4)break;
  }
  document.getElementById('cal').innerHTML=html;
}

document.fonts.ready.then(()=>{render();});
render();
</script>
</body>
</html>
