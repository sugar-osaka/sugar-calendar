<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>sugar 営業カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Yomogi&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fafaf8;min-height:100vh;padding:0 0 40px}
.wrap{max-width:480px;margin:0 auto;padding:1.5rem 1rem;font-family:'Yomogi',cursive;--theme:#A63F52;--theme-soft:#F9EFF1}
.wrap.shop-ebie{--theme:#7A9A60;--theme-soft:#E8EFE3}
.header{text-align:center;margin-bottom:1rem}
.header img{width:160px;height:auto;display:block;margin:0 auto 6px}
.header p{font-size:11px;letter-spacing:0.2em;color:#432f2f;margin-top:4px;font-family:'Yomogi',cursive}
.tabs{display:flex;gap:0;justify-content:center;margin-bottom:1rem;border:1.5px solid var(--theme-soft);border-radius:20px;overflow:hidden;width:fit-content;margin-left:auto;margin-right:auto}
.tab{padding:8px 22px;font-size:15px;cursor:pointer;background:#fff;color:#ccc;border:none;transition:all 0.15s;font-family:'Caveat Brush',cursive}
.tab:first-child{border-right:1.5px solid var(--theme-soft)}
.tab.active{background:var(--theme);color:#fff}
.shop-info-top{padding:4px 0;margin-bottom:1rem;font-size:11px;color:#432f2f;font-family:'Yomogi',cursive;line-height:2}
.shop-info-top .info-rows{display:table}
.shop-info-top .info-row{display:table-row}
.shop-info-top .info-icon{display:table-cell;width:22px;vertical-align:middle;padding-right:4px}
.shop-info-top .info-icon svg{width:18px;height:18px;vertical-align:middle}
.shop-info-top .info-name{display:table-cell;white-space:nowrap;vertical-align:middle;padding-right:6px}
.shop-info-top .info-days{display:table-cell;vertical-align:middle;padding-right:4px}
.shop-info-top .info-hours{display:table-cell;vertical-align:middle;white-space:nowrap}
.shop-info-top b{font-weight:400}
.day-dots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle;margin:0 2px}
.day-dot{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid #ddd;font-size:9px;color:#ccc;font-family:'Yomogi',cursive;line-height:1}
.day-dot.active{font-weight:600}
.nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:0.8rem}
.nav button{background:none;border:1.5px solid var(--theme-soft);border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--theme);display:flex;align-items:center;justify-content:center;font-size:18px}
.month{font-size:26px;color:var(--theme);min-width:140px;text-align:center;font-family:'Caveat Brush',cursive}
.cal-wrap{position:relative}
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:14px;color:#ccc;padding:6px 0 8px;text-align:center;font-weight:400;font-family:'Caveat Brush',cursive}
.cal th.sun{color:var(--theme)}
.cal th.sat{color:var(--theme);opacity:0.5}
.cal td{vertical-align:top;padding:4px;border-top:none;height:96px;width:14.28%;position:relative;overflow:visible;z-index:0}
.cal td.has-band-start{z-index:5}
.cal td.other .date-num{color:#eee}
.cal td.today .date-num{background:var(--theme);color:#fff!important;border-radius:50%}
.cal td.sun .date-num{color:var(--theme)}
.cal td.sat .date-num{color:var(--theme);opacity:0.5}
.cal td.other.sun .date-num,.cal td.other.sat .date-num{color:#eee}
.date-num{font-size:20px;margin-bottom:3px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:'Caveat Brush',cursive;position:relative;z-index:1}
.dot-row{display:flex;gap:4px;flex-wrap:wrap;position:relative;z-index:1}
.dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dot svg{width:20px;height:20px;flex-shrink:0;pointer-events:none}
.dot-cake{background:#F5D6DA;color:#B85366}
.dot-crepe{background:#F3E1BD;color:#A87C28}
.dot-muffin{background:#E6C58B;color:#A6834F}
.dot-takeout{background:#E8C5B9;color:#C22047}
.dot-cafe{background:#AEC1CD;color:#6B8294}
.dot-cafe2{background:#D8C4A7;color:#A68A6F}
.pill-closed{background:#AF011C;color:#fcebed;padding:3px 7px;border-radius:10px;font-size:11px;display:inline-block;margin-bottom:2px;font-family:'Yomogi',cursive;cursor:pointer;position:relative;z-index:1}
/* イベント帯・臨時休業帯 */
.event-band,.closed-band{position:absolute;top:32px;left:0;right:0;height:20px;z-index:3;display:flex;align-items:center;padding-left:4px;cursor:pointer;overflow:visible}
.event-band{background:#fcc800;}
.closed-band{background:#AF011C;}
/* 両方ある日はイベントを下にずらす */
.event-band.shift-down{top:55px;}
.event-band.band-start,.closed-band.band-start{border-radius:6px 0 0 6px;left:2px}
.event-band.band-end,.closed-band.band-end{border-radius:0 6px 6px 0;right:2px}
.event-band.band-single,.closed-band.band-single{border-radius:6px;left:2px;right:2px}
.event-band-label{display:none}
.closed-band-label{display:none}
/* band-text: SVGレイヤーで描画 */
.dot-row-below{margin-top:24px;display:flex;gap:4px;flex-wrap:wrap;position:relative;z-index:1}
.dot-row-below.double-band{margin-top:48px;}
.legend-wrap{margin-top:1.2rem;padding-top:1rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#432f2f;font-family:'Yomogi',cursive}
.leg-dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.leg-dot svg{width:20px;height:20px}
html.popup-open,body.popup-open{overflow:hidden;overscroll-behavior:none}
body.popup-open{position:fixed;width:100%;left:0;right:0}
.popup-overlay{position:fixed;top:-3px;left:0;right:0;bottom:-3px;width:100%;min-height:100vh;min-height:100dvh;min-height:-webkit-fill-available;background:rgba(0,0,0,0.25);z-index:100;margin:0;padding:0;border:none;opacity:0;visibility:hidden;transition:opacity 0.15s,visibility 0.15s;-webkit-tap-highlight-color:transparent}
.popup-overlay.is-open{opacity:1;visibility:visible}
.popup-card{position:fixed;left:0;top:0;z-index:101;background:#fff;border-radius:12px;padding:10px 12px 12px;box-shadow:0 4px 20px rgba(0,0,0,0.12);font-family:'Yomogi',cursive;width:auto;max-width:min(280px,calc(100vw - 16px));opacity:0;visibility:hidden;transform:scale(0.96);transition:opacity 0.12s,transform 0.12s,visibility 0.12s;pointer-events:none}
.popup-body{display:flex;align-items:flex-start;gap:10px;padding-right:18px}
.popup-text{min-width:0;flex:1}
.popup-name{font-size:16px;color:#432f2f;line-height:1.35;font-family:'Caveat Brush',cursive;white-space:normal;word-break:break-word;overflow-wrap:anywhere}
.popup-hours{font-size:13px;color:#432f2f;opacity:0.7;margin-top:2px;letter-spacing:0.04em;line-height:1.5;white-space:normal;word-break:break-word}
.popup-card.is-visible{opacity:1;visibility:visible;transform:scale(1);pointer-events:auto}
.popup-close{position:absolute;top:2px;right:2px;width:26px;height:26px;border:none;background:none;color:#ccc;font-size:20px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:sans-serif}
.popup-close:hover{color:var(--theme)}
.popup-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.popup-reserve{display:inline-block;margin-top:6px;padding:4px 10px;background:var(--theme,#e8383d);color:#fff;border-radius:20px;font-size:11px;font-family:'Yomogi',cursive;text-decoration:none;line-height:1.4}
.popup-reserve.hidden{display:none}
</style>
</head>
<body>
<div class="wrap shop-sagisu" id="wrap">
  <div class="header">
    <img src="logo.png" alt="sugar logo">
    <p>営業カレンダー</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setShop('sagisu')">sagisu</button>
    <button class="tab" onclick="setShop('ebie')">ebie</button>
  </div>
  <div class="shop-info-top" id="shop-info-top"></div>
  <div class="nav">
    <button onclick="changeMonth(-1)">&#8249;</button>
    <div class="month" id="month-label"></div>
    <button onclick="changeMonth(1)">&#8250;</button>
  </div>
  <div class="cal-wrap">
    <svg id="cal-lines" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible" xmlns="http://www.w3.org/2000/svg"></svg>
    <table class="cal" id="cal"></table>
  </div>
  <div class="legend-wrap"><div class="legend" id="legend"></div></div>
</div>
<div class="popup-overlay" id="popup-overlay" aria-hidden="true">
  <div class="popup-card" id="popup-card" role="dialog" aria-modal="true" aria-labelledby="popup-name">
    <button type="button" class="popup-close" id="popup-close" aria-label="閉じる">&times;</button>
    <div class="popup-body">
      <div class="popup-icon" id="popup-icon"></div>
      <div class="popup-text">
        <div class="popup-name" id="popup-name"></div>
        <div class="popup-hours" id="popup-hours"></div>
        <a class="popup-reserve" id="popup-reserve" href="#" target="_blank" rel="noopener noreferrer">予約はこちら →</a>
      </div>
    </div>
  </div>
</div>
<script>
// ============================================================
// スプレッドシートCSV URL
// ============================================================
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTPofFfru7LP5csztEsj2BlMcfl6NeVuTw9_cUwAyw_bn948b-Ro2cYQQ6tWIpeLZegaqaOcnFblFUD/pub?output=csv';

var shop = 'sagisu';
var now = new Date();
var year = now.getFullYear();
var month = now.getMonth();
var today = now;
var maxYear = now.getMonth() === 11 ? now.getFullYear() + 1 : now.getFullYear();
var maxMonth = now.getMonth() === 11 ? 0 : now.getMonth() + 1;

var COLORS = {
  cake:'#B85366', crepe:'#A87C28', muffin:'#A6834F',
  takeout:'#C22047', cafe:'#6B8294', cafe2:'#A68A6F'
};

var SVG = {
  cake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="9" x2="8" y2="5"/><line x1="12" y1="9" x2="12" y2="4"/><line x1="16" y1="9" x2="16" y2="5"/><path d="M7 4.5 Q8 3 9 4.5"/><path d="M11 3 Q12 1.5 13 3"/><path d="M15 4.5 Q16 3 17 4.5"/><rect x="3" y="9" width="18" height="11" rx="2.5"/><path d="M3 13 Q7 11 12 13 Q17 11 21 13"/><line x1="3" y1="16" x2="21" y2="16"/></svg>',
  crepe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10 L12 22 L19 10 Z"/><path d="M5 10 Q12 7 19 10"/><path d="M7 10 Q9 8 12 8 Q15 8 17 10"/><path d="M8 7 Q8 4 10 4 Q12 3 14 4 Q16 4 16 7"/><path d="M9 6 Q10 4.5 12 4.5 Q14 4.5 15 6"/><circle cx="10" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="13" cy="4.5" r="0.8" fill="currentColor" stroke="none"/></svg>',
  muffin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13 L8 21 L16 21 L17 13 Z"/><line x1="10" y1="13" x2="9.5" y2="21"/><line x1="12" y1="13" x2="12" y2="21"/><line x1="14" y1="13" x2="14.5" y2="21"/><path d="M7 13 Q5 13 5 10 Q5 7 8 6 Q9 3 12 3 Q15 3 16 6 Q19 7 19 10 Q19 13 17 13 Q15 14 12 14 Q9 14 7 13 Z"/><path d="M8 7 Q9 5.5 11 6"/><path d="M14 5.5 Q15.5 6.5 15 8"/></svg>',
  takeout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="15" width="18" height="4" rx="1"/><rect x="3" y="11" width="18" height="4" rx="0.5"/><path d="M3 11 L12 5 L21 11"/><path d="M3 11 Q7 9.5 12 10.5 Q17 9.5 21 11"/><ellipse cx="12" cy="5.5" rx="3" ry="3.5" fill="currentColor" stroke="none"/><path d="M10.5 3 Q12 1.8 13.5 3" stroke="currentColor" stroke-width="1" fill="none"/></svg>',
  cafe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L17 8 L15 19 L9 19 Z"/><path d="M17 10 Q21 10 21 14 Q21 18 17 18"/><line x1="5" y1="22" x2="19" y2="22"/><path d="M10 5 Q10 3 12 3 Q12 5 10 5"/></svg>',
  cafe2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8 L17 8 L15 19 L9 19 Z"/><path d="M17 10 Q21 10 21 14 Q21 18 17 18"/><line x1="5" y1="22" x2="19" y2="22"/><path d="M9 5 Q11 2 13 5"/></svg>'
};

var DOTCLS = {
  cake:'dot-cake', crepe:'dot-crepe', muffin:'dot-muffin',
  takeout:'dot-takeout', cafe:'dot-cafe', cafe2:'dot-cafe2'
};

// デフォルト営業時間
var TYPE_INFO = {
  cake:   {name:'ホールケーキ', hours:'12:00-17:00'},
  crepe:  {name:'クレープ',     hours:'12:00-16:00'},
  takeout:{name:'テイクアウト', hours:'12:00-18:00'},
  cafe:   {name:'イートイン',   hours:'13:00-17:30 (L.O.17:00)'},
  cafe2:  {name:'気まぐれカフェ', hours:'12:00-16:30 (L.O.16:00)'},
  muffin: {name:'マフィン',     hours:'12:00-18:00'}
};

// スプシから読み込むデータ
var specialEvents  = {sagisu:{}, ebie:{}};
var eventBands     = {sagisu:{}, ebie:{}};
var closedBands    = {sagisu:{}, ebie:{}};
var offTypes       = {sagisu:{}, ebie:{}};
var timeOverrides  = {sagisu:{}, ebie:{}};
// 予約URL: reserveUrls[shop][type] = 'https://...' または reserveUrls[shop]['event-dateKey'] = 'https://...'
var reserveUrls    = {sagisu:{}, ebie:{}};
// 営業曜日設定 dayOverrides[shop][type] = [0,1,2,...] (0=日,1=月,...,6=土)
var dayOverrides   = {sagisu:{}, ebie:{}};

function dateKey(d) { return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }

function parseDate(str) {
  if (!str) return null;
  var s = str.trim().replace(/\//g,'-');
  var p = s.split('-');
  if (p.length < 3) return null;
  return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
}

function formatDateJP(d) { return (d.getMonth()+1)+'/'+d.getDate(); }

function parseAndApplyCSV(text) {
  specialEvents  = {sagisu:{}, ebie:{}};
  eventBands     = {sagisu:{}, ebie:{}};
  closedBands    = {sagisu:{}, ebie:{}};
  offTypes       = {sagisu:{}, ebie:{}};
  timeOverrides  = {sagisu:{}, ebie:{}};
  dayOverrides   = {sagisu:{}, ebie:{}};
  var rows = text.trim().split('\n');
  for (var i = 1; i < rows.length; i++) {
    var cols = rows[i].split(',');
        var dateStr   = (cols[0]||'').trim();
        var endDateStr= (cols[1]||'').trim();
        var shopRaw   = (cols[2]||'').trim().toLowerCase();
        var kindRaw   = (cols[3]||'').trim();
        var targetRaw = (cols[4]||'').trim();
        var content   = (cols[5]||'').trim();
        var eventHours= (cols[6]||'').trim();
        var reserveUrl= (cols[7]||'').trim();

        // 店舗名の正規化
        var shopName = shopRaw;

        // 種別の日本語→英語変換
        var kindMap = {
          '非表示':'off', '営業時間変更':'time', '臨時休業':'closed',
          'イベント':'event', '固定営業時間':'time_default', '固定営業曜日':'day',
          '固定営業曜日&予約URL':'day',
          'off':'off', 'time':'time', 'closed':'closed',
          'event':'event', 'time_default':'time_default', 'day':'day'
        };
        var kind = kindMap[kindRaw] || kindRaw.toLowerCase();

        // 対象の日本語→英語変換
        var targetMap = {
          'ホールケーキ':'cake', 'クレープ':'crepe', 'テイクアウト':'takeout',
          'イートイン':'cafe', '気まぐれカフェ':'cafe2', 'マフィン':'muffin',
          'cake':'cake', 'crepe':'crepe', 'takeout':'takeout',
          'cafe':'cafe', 'cafe2':'cafe2', 'muffin':'muffin'
        };
        var target = targetMap[targetRaw] || targetRaw.toLowerCase();

        if (shopName !== 'sagisu' && shopName !== 'ebie') continue;

        // 通常営業時間のデフォルト変更
        if (kind === 'time_default' && target && content) {
          if (TYPE_INFO[target]) TYPE_INFO[target].hours = content;
          continue;
        }

        // 営業曜日の設定（日付不要）
        if (kind === 'day' && target) {
          if (content) {
            var dayMap = {'日':0,'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
            var days = [];
            for (var ci = 0; ci < content.length; ci++) {
              if (dayMap[content[ci]] !== undefined) days.push(dayMap[content[ci]]);
            }
            if (days.length) dayOverrides[shopName][target] = days;
          }
          // H列に予約URLがあれば保存
          if (reserveUrl) reserveUrls[shopName][target] = reserveUrl;
          continue;
        }

        var startD = parseDate(dateStr);
        if (!startD) continue;
        var dk = dateKey(startD);

        if (kind === 'off') {
          if (!offTypes[shopName][dk]) offTypes[shopName][dk] = [];
          offTypes[shopName][dk].push(target);

        } else if (kind === 'time') {
          if (!timeOverrides[shopName][dk]) timeOverrides[shopName][dk] = {};
          timeOverrides[shopName][dk][target] = content;

        } else if (kind === 'closed') {
          var endD = parseDate(endDateStr) || startD;
          var periodText = formatDateJP(startD);
          if (startD.toDateString() !== endD.toDateString()) periodText += '〜'+formatDateJP(endD);
          var cur = new Date(startD);
          while (cur <= endD) {
            var ck = dateKey(cur);
            var isStart = cur.toDateString() === startD.toDateString();
            var isEnd   = cur.toDateString() === endD.toDateString();
            closedBands[shopName][ck] = {
              label: content || '臨時休業',
              period: periodText,
              isStart: isStart,
              isEnd: isEnd,
              single: startD.toDateString() === endD.toDateString()
            };
            cur.setDate(cur.getDate()+1);
          }

        } else if (kind === 'event') {
          var endD = parseDate(endDateStr) || startD;
          var periodText = formatDateJP(startD);
          if (startD.toDateString() !== endD.toDateString()) periodText += '〜'+formatDateJP(endD);
          var cur = new Date(startD);
          while (cur <= endD) {
            var ck = dateKey(cur);
            var isStart = cur.toDateString() === startD.toDateString();
            var isEnd   = cur.toDateString() === endD.toDateString();
            eventBands[shopName][ck] = {
              name: content,
              hours: eventHours,
              period: periodText,
              isStart: isStart,
              isEnd: isEnd,
              reserveUrl: reserveUrl
            };
            cur.setDate(cur.getDate()+1);
          }
        }
        // 予約URL（H列から全typeに対応）
        if (reserveUrl && target) {
          reserveUrls[shopName][target] = reserveUrl;
        }
      }
  render();
}

function loadCSV() {
  var CACHE_KEY = 'sugar_csv';
  var CACHE_TIME_KEY = 'sugar_csv_time';
  var CACHE_DURATION = 5 * 60 * 1000; // 5分
  // 強制リロード時はキャッシュをクリア
  try {
    if (performance && performance.navigation && performance.navigation.type === 1) {
      sessionStorage.removeItem(CACHE_KEY);
      sessionStorage.removeItem(CACHE_TIME_KEY);
    }
  } catch(e) {}
  try {
    var cached = sessionStorage.getItem(CACHE_KEY);
    var cachedTime = sessionStorage.getItem(CACHE_TIME_KEY);
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < CACHE_DURATION) {
      parseAndApplyCSV(cached);
      return;
    }
  } catch(e) {}
  fetch(CSV_URL)
    .then(function(r){ return r.text(); })
    .then(function(text){
      try {
        sessionStorage.setItem(CACHE_KEY, text);
        sessionStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
      } catch(e) {}
      parseAndApplyCSV(text);
    })
    .catch(function(){ render(); });
}

function getHours(type, d) {
  var dk = dateKey(d);
  var ov = timeOverrides[shop][dk];
  if (ov && ov[type]) return ov[type];
  return TYPE_INFO[type] ? TYPE_INFO[type].hours : '';
}

// 曜日番号の配列を「月〜水」などの表示文字列に変換
var DAY_NAMES = ['日','月','火','水','木','金','土'];
var DAY_ORDER = [1,2,3,4,5,6,0]; // 月〜日の順

function daysToText(days) {
  if (!days || days.length === 0) return '';
  // DAY_ORDER順に並べ直す
  var sorted = DAY_ORDER.filter(function(d){ return days.indexOf(d) !== -1; });
  if (sorted.length === 7) return '毎日';
  // 連続する曜日をまとめる（例：月火水→月〜水）
  var result = [];
  var i = 0;
  while (i < sorted.length) {
    var start = i;
    while (i + 1 < sorted.length && DAY_ORDER.indexOf(sorted[i+1]) === DAY_ORDER.indexOf(sorted[i]) + 1) i++;
    if (i - start >= 2) {
      result.push(DAY_NAMES[sorted[start]] + '〜' + DAY_NAMES[sorted[i]]);
    } else {
      for (var j = start; j <= i; j++) result.push(DAY_NAMES[sorted[j]]);
    }
    i++;
  }
  return result.join('・');
}

function drawCalendarLines() {
  var cal = document.getElementById('cal');
  var svg = document.getElementById('cal-lines');
  if (!cal||!svg||!cal.rows.length) return;
  var wrap = document.querySelector('.cal-wrap');
  var wrapRect = wrap.getBoundingClientRect();
  var calRect  = cal.getBoundingClientRect();
  var stroke = ' stroke="#6f5436" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"';
  var paths = '';
  var x0 = calRect.left-wrapRect.left;
  var W  = calRect.width;
  cal.querySelectorAll('tbody tr').forEach(function(row){
    var y = row.getBoundingClientRect().top-wrapRect.top;
    var segs=16, step=W/segs;
    var d='M '+x0+' '+y;
    for(var s=0;s<segs;s++){
      var cx=x0+s*step+step*0.4, cy=y+(s%2===0?-1.5:1.5), ex=x0+(s+1)*step;
      d+=' Q '+cx+' '+cy+' '+ex+' '+y;
    }
    paths+='<path d="'+d+'"'+stroke+'/>';
  });
  var hCells = cal.rows[0].cells;
  var yTop   = calRect.top-wrapRect.top;
  var yBottom= cal.rows[cal.rows.length-1].getBoundingClientRect().bottom-wrapRect.top;
  var H=yBottom-yTop;
  var vSegs=Math.max(8,Math.round(H/18));
  var vW=[0.35,-0.3,0.25,-0.35,0.3,-0.25];
  for(var c=1;c<hCells.length;c++){
    var x=Math.round(hCells[c].getBoundingClientRect().left-wrapRect.left);
    var vStep=H/vSegs;
    var vd='M '+x+' '+yTop;
    for(var v=0;v<vSegs;v++){
      var vx=x+vW[v%vW.length], vy=yTop+v*vStep+vStep*0.35, ey=yTop+(v+1)*vStep;
      vd+=' Q '+vx+' '+vy+' '+x+' '+ey;
    }
    paths+='<path d="'+vd+'"'+stroke+'/>';
  }
  svg.innerHTML=paths;

  // 帯テキストをSVGで描画
  var bandTexts = '';
  var allTds = Array.prototype.slice.call(cal.querySelectorAll('tbody td'));
  allTds.forEach(function(td) {
    var band = td.querySelector('.event-band.band-start, .event-band.band-single');
    var closedBand = td.querySelector('.closed-band.band-start, .closed-band.band-single');
    var target = band || closedBand;
    if (!target) return;

    var isEvent = !!band;
    var name = isEvent
      ? (target.getAttribute('data-name') || '')
      : (target.getAttribute('data-label') || '');
    if (!name) return;

    // shift-downの場合はy位置を下げる
    var isShifted = target.classList.contains('shift-down');

    // 帯の終わりtdを探して全体幅を計算
    var startIdx = allTds.indexOf(td);
    var totalWidth = 0;
    for (var i = startIdx; i < allTds.length; i++) {
      var curTd = allTds[i];
      var curBand = curTd.querySelector(isEvent ? '.event-band' : '.closed-band');
      if (!curBand) break;
      totalWidth += curTd.getBoundingClientRect().width;
      if (curBand.classList.contains('band-end') || curBand.classList.contains('band-single')) break;
    }

    var tdRect = td.getBoundingClientRect();
    var x = tdRect.left - wrapRect.left + 5;
    var bandTop = isShifted ? 55 : 32;
    var y = tdRect.top - wrapRect.top + bandTop + 14;
    var color = isEvent ? '#432f2f' : '#ffffff';
    var clipW = totalWidth - 8;

    var clipId = 'clip-band-' + startIdx;
    bandTexts += '<clipPath id="' + clipId + '"><rect x="' + (x-2) + '" y="' + (y-14) + '" width="' + clipW + '" height="20"/></clipPath>';
    bandTexts += '<text x="' + x + '" y="' + y + '" font-size="11" font-family="Yomogi,cursive" fill="' + color + '" clip-path="url(#' + clipId + ')" style="pointer-events:none">' + name + '</text>';
  });

  svg.innerHTML = paths + bandTexts;
}

  document.getElementById('month-label').textContent=labs[month]+' '+year;

  });

  var legendHTML='';
  shops[shop].getLegend().forEach(function(l){
    if(l.pill){
      var pt=l.textColor || (l.pill==='#fcc800'?'#432f2f':'#fff');
      legendHTML+='<div class="leg"><div class="leg-dot" style="background:'+l.pill+';color:'+pt+';font-size:10px;border-radius:10px;padding:0 6px;width:auto;min-width:28px">'+l.label+'</div></div>';
    } else {
      legendHTML+='<div class="leg"><div class="leg-dot '+l.cls+'">'+l.svg+'</div><span>'+l.label+'</span></div>';
    }
  });
  document.getElementById('legend').innerHTML=legendHTML;

  var first=new Date(year,month,1), last=new Date(year,month+1,0), startDay=first.getDay();
  var html='<tr><th class="sun">Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th class="sat">Sat</th></tr>';
  var day=1-startDay;
  for(var row=0;row<6;row++){
    html+='<tr>';
    var rowShiftDown = false; // この行でshift-downが必要か（行をまたいでリセット）
    for(var col=0;col<7;col++){
      var d=new Date(year,month,day);
      var isOther=day<1||day>last.getDate();
      var isToday=d.toDateString()===today.toDateString();
      var cls='';
      if(isOther) cls+=' other';
      if(isToday) cls+=' today';
      if(col===0) cls+=' sun';
      if(col===6) cls+=' sat';
      html+='<td class="'+cls.trim()+'">';
      if(!isOther){
        html+='<div class="date-num">'+day+'</div>';
        var dk=dateKey(d);
        var sp=specialEvents[shop][dk];
        var band=eventBands[shop][dk];

        if(sp){
          sp.forEach(function(e){
            if(e.type==='closed') html+='<div class="pill-closed" data-popup="closed" data-label="'+(e.label||'臨時休業')+'">'+(e.label||'臨時休業')+'</div>';
          });
        } else if(closedBands[shop][dk] && band){
          // 臨時休業とイベントが同じ日に重なる場合
          // → この日からrowShiftDownをtrueに（行が変わるまで維持）
          rowShiftDown = true;
          var cb=closedBands[shop][dk];
          var cc='closed-band';
          if(cb.single||cb.isStart&&cb.isEnd) cc='closed-band band-single';
          else if(cb.isStart) cc='closed-band band-start';
          else if(cb.isEnd)   cc='closed-band band-end';
          var clabel=cb.isStart?'<span class="closed-band-label">'+cb.label+'</span>':'';
          html+='<div class="'+cc+'" data-popup="closed" data-label="'+cb.label+'" data-period="'+cb.period+'">'+clabel+'</div>';
          var bc='event-band shift-down';
          if(band.isStart) bc+=' band-start';
          if(band.isEnd)   bc+=' band-end';
          if(band.isStart&&band.isEnd) bc='event-band shift-down band-single';
          if(band.isStart) html=html.replace(/<td class="([^"]*)">\s*$/, '<td class="$1 has-band-start">');
          var labelPart=band.isStart?'<span class="event-band-label">'+band.name+'</span>':'';
          html+='<div class="'+bc+'" data-popup="event" data-name="'+band.name+'" data-period="'+band.period+'" data-hours="'+band.hours+'" data-reserve="'+(band.reserveUrl||'')+'">'+labelPart+'</div>';
          // 臨時休業+イベント重複日: イートイン・テイクアウト等のアイコンは非表示（イベント帯のみ表示）
          // イベント帯の終端なら次の行ではshift不要
          if(band.isEnd || (band.isStart&&band.isEnd)) rowShiftDown = false;
        } else if(closedBands[shop][dk]){
          var cb=closedBands[shop][dk];
          var cc='closed-band';
          if(cb.single) cc='closed-band band-single';
          else if(cb.isStart&&cb.isEnd) cc='closed-band band-single';
          else if(cb.isStart) cc='closed-band band-start';
          else if(cb.isEnd)   cc='closed-band band-end';
          if(cb.isStart) html=html.replace(/<td class="([^"]*)">\s*$/, '<td class="$1 has-band-start">');
          var clabel=cb.isStart?'<span class="closed-band-label">'+cb.label+'</span>':'';
          html+='<div class="'+cc+'" data-popup="closed" data-label="'+cb.label+'" data-period="'+cb.period+'">'+clabel+'</div>';

        } else if(band){
          // rowShiftDownがtrueの場合（同じ行の前のセルで臨時休業+イベント重複があった）
          var needsShift = rowShiftDown;
          var bc = needsShift ? 'event-band shift-down' : 'event-band';
          if(band.isStart) bc+=' band-start';
          if(band.isEnd)   bc+=' band-end';
          if(band.isStart&&band.isEnd) bc=(needsShift?'event-band shift-down':'event-band')+' band-single';
          if(band.isStart) html=html.replace(/<td class="([^"]*)">\s*$/, '<td class="$1 has-band-start">');
          var labelPart=band.isStart?'<span class="event-band-label">'+band.name+'</span>':'';
          html+='<div class="'+bc+'" data-popup="event" data-name="'+band.name+'" data-period="'+band.period+'" data-hours="'+band.hours+'" data-reserve="'+(band.reserveUrl||'')+'">'+labelPart+'</div>';

          // 通常アイコンも表示
          var evs=shops[shop].getEvents(d);
          if(evs.length){
            var belowCls = needsShift ? 'dot-row-below double-band' : 'dot-row-below';
            html+='<div class="'+belowCls+'">';
            evs.forEach(function(e){
              var hrs=getHours(e.type,d);
              html+='<div class="dot '+(DOTCLS[e.type]||'')+'" data-type="'+e.type+'" data-hours="'+hrs+'" role="button" tabindex="0">'+(SVG[e.type]||'')+'</div>';
            });
            html+='</div>';
          }
          // イベント帯の終端でrowShiftDownをリセット
          if(band.isEnd || (band.isStart&&band.isEnd)) rowShiftDown = false;
        } else {
          var evs=shops[shop].getEvents(d);
          html+='<div class="dot-row">';
          evs.forEach(function(e){
            var hrs=getHours(e.type,d);
            html+='<div class="dot '+(DOTCLS[e.type]||'')+'" data-type="'+e.type+'" data-hours="'+hrs+'" role="button" tabindex="0">'+(SVG[e.type]||'')+'</div>';
          });
          html+='</div>';
        }
      }
      html+='</td>';
      day++;
    }
    html+='</tr>';
    if(day>last.getDate()&&row>=4) break;
  }
  document.getElementById('cal').innerHTML=html;
  setTimeout(function(){ drawCalendarLines(); updateBandTextWidths(); }, 100);
}

var popupScrollY=0, popupAnchorEl=null;

function lockPageScroll(){
  popupScrollY=window.scrollY||window.pageYOffset;
  document.documentElement.classList.add('popup-open');
  document.body.classList.add('popup-open');
  document.body.style.top='-'+popupScrollY+'px';
}
function unlockPageScroll(){
  document.documentElement.classList.remove('popup-open');
  document.body.classList.remove('popup-open');
  document.body.style.top='';
  window.scrollTo(0,popupScrollY);
}
function positionPopupNear(anchorEl,card){
  var gapH=-6,gapV=-6,margin=8;
  var anchor=anchorEl.getBoundingClientRect();
  var cardW=card.offsetWidth,cardH=card.offsetHeight;
  var vw=window.innerWidth,vh=window.innerHeight;
  var left,top;
  if(anchor.right+gapH+cardW<=vw-margin){left=anchor.right+gapH;top=anchor.top-cardH-gapV;}
  else{left=anchor.left-cardW-gapH;top=anchor.top-cardH-gapV;}
  if(top<margin) top=anchor.bottom+gapV;
  if(left<margin) left=margin;
  if(left+cardW>vw-margin) left=vw-margin-cardW;
  if(top+cardH>vh-margin) top=vh-margin-cardH;
  card.style.left=Math.round(left)+'px';
  card.style.top=Math.round(top)+'px';
}
function showPopup(iconCls,iconSVG,iconColor,name,hoursText,anchorEl,reserveUrl,btnText){
  popupAnchorEl=anchorEl;
  var overlay=document.getElementById('popup-overlay');
  var card=document.getElementById('popup-card');
  var iconEl=document.getElementById('popup-icon');
  iconEl.className='popup-icon'+(iconCls?' '+iconCls:'');
  iconEl.innerHTML='';
  if(iconSVG && iconColor){
    var colored = iconSVG
      .replace(/stroke="currentColor"/g, 'stroke="'+iconColor+'"')
      .replace(/fill="currentColor"/g, 'fill="'+iconColor+'"');
    // namespaceを明示してSVGを生成（iPhone Safari対応）
    var wrapper = document.createElementNS('http://www.w3.org/2000/svg','svg');
    wrapper.setAttribute('viewBox','0 0 24 24');
    wrapper.setAttribute('width','18');
    wrapper.setAttribute('height','18');
    wrapper.setAttribute('fill','none');
    wrapper.setAttribute('stroke',iconColor);
    wrapper.setAttribute('stroke-width','1.6');
    wrapper.setAttribute('stroke-linecap','round');
    wrapper.setAttribute('stroke-linejoin','round');
    // innerHTMLはSVG要素内では動作する
    wrapper.innerHTML = colored.replace(/<svg[^>]*>/,'').replace('</svg>','');
    iconEl.appendChild(wrapper);
  }
  document.getElementById('popup-name').textContent=name;
  document.getElementById('popup-hours').innerHTML=hoursText;
  var reserveEl=document.getElementById('popup-reserve');
  if(reserveUrl){
    reserveEl.href=reserveUrl;
    reserveEl.textContent=(btnText||'予約はこちら')+' →';
    reserveEl.classList.remove('hidden');
  } else {
    reserveEl.href='#';
    reserveEl.classList.add('hidden');
  }
  card.classList.remove('is-visible');
  lockPageScroll();
  overlay.classList.add('is-open');
  overlay.setAttribute('aria-hidden','false');
  requestAnimationFrame(function(){
    positionPopupNear(anchorEl,card);
    card.classList.add('is-visible');
  });
}
function hideTypePopup(){
  var overlay=document.getElementById('popup-overlay');
  var card=document.getElementById('popup-card');
  card.classList.remove('is-visible');
  overlay.classList.remove('is-open');
  overlay.setAttribute('aria-hidden','true');
  popupAnchorEl=null;
  unlockPageScroll();
}
